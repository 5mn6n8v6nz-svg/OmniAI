<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>OmniAI</title>
<style>
  :root { --bg:#212121; --side:#171717; --panel:#2f2f2f; --text:#ececec;
          --muted:#8e8ea0; --accent:#10a37f; --border:#3a3a3a; }
  * { box-sizing: border-box; }
  html, body { margin:0; height:100%; background:var(--bg); color:var(--text);
    font-family:-apple-system,"SF Arabic","Segoe UI",Tahoma,sans-serif; }
  body { display:flex; overflow:hidden; }
  aside { width:260px; background:var(--side); display:flex; flex-direction:column;
    padding:12px; gap:8px; flex-shrink:0; }
  .brand { font-weight:700; font-size:18px; padding:6px 4px 12px; }
  .btn { background:transparent; color:var(--text); border:1px solid var(--border);
    border-radius:8px; padding:10px; cursor:pointer; font-size:14px; text-align:start; }
  .btn:hover { background:var(--panel); }
  .list { flex:1; overflow-y:auto; }
  .chat-item { padding:10px; border-radius:8px; cursor:pointer; font-size:14px;
    white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .chat-item:hover, .chat-item.active { background:var(--panel); }
  main { flex:1; display:flex; flex-direction:column; min-width:0; }
  header { padding:14px 20px; border-bottom:1px solid var(--border); }
  #messages { flex:1; overflow-y:auto; padding:20px 0; }
  .wrap { max-width:780px; margin:0 auto; padding:0 20px; }
  .msg { display:flex; gap:12px; margin-bottom:22px; }
  .avatar { width:30px; height:30px; border-radius:6px; flex-shrink:0; display:flex;
    align-items:center; justify-content:center; font-size:12px; font-weight:700; }
  .user .avatar { background:#5436da; }
  .bot .avatar { background:var(--accent); }
  .content { white-space:pre-wrap; line-height:1.8; word-wrap:break-word; min-width:0; flex:1; }
  .muted { color:var(--muted); }
  .empty { text-align:center; margin-top:15vh; }
  footer { padding:12px 20px 18px; }
  .inputbox { max-width:780px; margin:0 auto; background:var(--panel); border-radius:16px;
    display:flex; align-items:flex-end; padding:8px 8px 8px 12px; gap:8px; }
  textarea { flex:1; background:transparent; border:none; outline:none; color:var(--text);
    resize:none; font-size:16px; font-family:inherit; max-height:180px; padding:8px 4px; }
  .send { background:var(--text); color:#000; border:none; border-radius:50%;
    width:34px; height:34px; cursor:pointer; font-size:16px; flex-shrink:0; }
  .send:disabled { opacity:.4; }
  @media (max-width:700px) { aside { display:none; } }
</style>
</head>
<body>

<aside>
  <div class="brand">OmniAI</div>
  <button class="btn" id="newChat">+ محادثة جديدة</button>
  <div class="list" id="chatList"></div>
  <button class="btn" id="memBtn">🧠 ما أعرفه عنك</button>
</aside>

<main>
  <header><span id="title">محادثة جديدة</span></header>
  <div id="messages"><div class="wrap" id="msgWrap"></div></div>
  <footer>
    <div class="inputbox">
      <textarea id="input" rows="1" placeholder="اسألني أي شيء..."></textarea>
      <button class="send" id="sendBtn">↑</button>
    </div>
  </footer>
</main>

<script>
const STORE = "omniai_web_v1";
let state = JSON.parse(localStorage.getItem(STORE) || "null") || { memory: {}, chats: [], currentId: null };
const save = () => localStorage.setItem(STORE, JSON.stringify(state));
const $ = id => document.getElementById(id);
const msgWrap = $("msgWrap"), messages = $("messages"), input = $("input");
let busy = false;

function currentChat() { return state.chats.find(c => c.id === state.currentId); }

function newChat() {
  const chat = { id: Date.now().toString(), title: "محادثة جديدة", messages: [] };
  state.chats.unshift(chat);
  state.currentId = chat.id;
  save(); render();
}

function escapeHTML(s) {
  return s.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
}

function renderSidebar() {
  const list = $("chatList");
  list.innerHTML = "";
  state.chats.forEach(c => {
    const div = document.createElement("div");
    div.className = "chat-item" + (c.id === state.currentId ? " active" : "");
    div.textContent = c.title;
    div.onclick = () => { state.currentId = c.id; save(); render(); };
    list.appendChild(div);
  });
}

function renderMessages() {
  const chat = currentChat();
  $("title").textContent = chat ? chat.title : "محادثة جديدة";
  msgWrap.innerHTML = "";
  if (!chat || chat.messages.length === 0) {
    msgWrap.innerHTML = `<div class="empty"><h1>كيف أقدر أساعدك اليوم؟</h1>
      <p class="muted">اسألني أي شيء، أو قل "اسمي ..." لأتذكره.</p></div>`;
    return;
  }
  chat.messages.forEach(m => {
    const div = document.createElement("div");
    div.className = "msg " + (m.role === "user" ? "user" : "bot");
    div.innerHTML = `<div class="avatar">${m.role === "user" ? "أنت" : "AI"}</div>
      <div class="content">${escapeHTML(m.content)}</div>`;
    msgWrap.appendChild(div);
  });
  messages.scrollTop = messages.scrollHeight;
}

function render() { renderSidebar(); renderMessages(); }

function extractMemory(text) {
  let m = text.match(/^(?:اسمي|أنا اسمي|انا اسمي)\s+(.+)$/);
  if (m) { state.memory["اسمي"] = m[1].trim(); return `تم حفظ اسمك: ${m[1].trim()}`; }
  m = text.match(/^تذكر\s+(?:ان\s+|أن\s+)?(.+?)\s+(?:هو|هي|يساوي|=)\s*(.+)$/);
  if (m) { state.memory[m[1].trim()] = m[2].trim(); return `تم الحفظ: ${m[1].trim()}`; }
  return null;
}

function memoryText() {
  return Object.entries(state.memory).map(([k, v]) => `- ${k}: ${v}`).join("\n");
}

async function sendMessage() {
  const text = input.value.trim();
  if (!text || busy) return;
  if (!currentChat()) newChat();
  const chat = currentChat();

  const note = extractMemory(text);
  chat.messages.push({ role: "user", content: text });
  if (chat.messages.length === 1) chat.title = text.slice(0, 40);
  input.value = ""; autoGrow();
  save(); render();

  busy = true; $("sendBtn").disabled = true;
  try {
    const res = await fetch("/api/chat", {
      method: "POST",
      headers: { "content-type": "application/json" },
      body: JSON.stringify({ messages: chat.messages.slice(-30), memory: memoryText() })
    });
    const data = await res.json();
    if (!res.ok) throw new Error(data.error || "خطأ غير معروف");
    chat.messages.push({ role: "assistant",
      content: note ? data.answer + "\n\n(" + note + ")" : data.answer });
  } catch (e) {
    chat.messages.push({ role: "assistant", content: "⚠️ " + e.message });
  }
  save(); render();
  busy = false; $("sendBtn").disabled = false;
}

function autoGrow() {
  input.style.height = "auto";
  input.style.height = Math.min(input.scrollHeight, 180) + "px";
}
input.addEventListener("input", autoGrow);
input.addEventListener("keydown", e => {
  if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); sendMessage(); }
});
$("sendBtn").onclick = sendMessage;
$("newChat").onclick = newChat;

$("memBtn").onclick = () => {
  const entries = Object.entries(state.memory);
  if (!entries.length) { alert("ما عندي شي محفوظ عنك بعد."); return; }
  const text = entries.map(([k, v]) => `• ${k}: ${v}`).join("\n");
  if (confirm(text + "\n\nتبي تمسح كل الذاكرة؟")) { state.memory = {}; save(); }
};

if (state.chats.length === 0) newChat();
render();
</script>
</body>
</html>
